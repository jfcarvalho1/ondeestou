name: Construir APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Construir APK de debug
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Onde-Estou-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Preparar APK para download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OndeEstou.apk
      - name: Publicar APK (link fixo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Onde Estou — APK Android
          body: "Descarregar e instalar no Android: OndeEstou.apk"
          make_latest: true
          files: OndeEstou.apk
